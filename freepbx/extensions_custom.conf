; ---------------------------------------------------------------------------
; Dial 400 from any internal phone to talk to Home Assistant Assist.
;
; Append this to /etc/asterisk/extensions_custom.conf on the FreePBX box
; (or paste into Admin -> Config Edit -> extensions_custom.conf), then run
; "fwconsole reload".
;
; Pick a number (here 400) that doesn't collide with an existing extension,
; feature code, or ring group. The caller's extension number is passed to
; Home Assistant as the SIP From user - that's how HA knows which room is
; calling, so don't override CALLERID here.
; ---------------------------------------------------------------------------

[from-internal-custom]
exten => 400,1,NoOp(Home Assistant Assist call from ${CALLERID(num)})
 same => n,Set(TIMEOUT(absolute)=300)
 same => n,Dial(PJSIP/assist@ha-assist,120)
 same => n,Hangup()
