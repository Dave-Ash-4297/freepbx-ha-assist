; ---------------------------------------------------------------------------
; Home Assistant Assist endpoint
;
; Append this to /etc/asterisk/pjsip.endpoint_custom.conf on the FreePBX box
; (or paste into Admin -> Config Edit -> pjsip.endpoint_custom.conf), then
; run "fwconsole reload".
;
; CHANGE 192.168.1.50 to your Home Assistant IP, and 5060 to the port you
; chose when adding the FreePBX Assist integration in Home Assistant.
;
; If Home Assistant sits behind a router/NAT relative to the PBX, point
; contact= at that router's address instead and forward UDP <SIP port> and
; UDP <RTP port>-<RTP port+1> (set "RTP audio port" in the integration's
; Configure dialog) from the PBX to Home Assistant. Also make sure the PBX's
; own subnet is listed under Settings -> Asterisk SIP Settings -> NAT ->
; Local Networks, or Asterisk will put its public IP in the SDP.
; ---------------------------------------------------------------------------

[ha-assist]
type=aor
contact=sip:assist@192.168.1.50:5060
qualify_frequency=0

[ha-assist]
type=endpoint
context=from-internal
disallow=all
allow=opus
aors=ha-assist
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Put the PBX's real address in the From header instead of its hostname
; (Raspbx resolves its own name to 127.0.1.1). Set to the PBX IP.
from_domain=192.168.1.10
; Hang the call up if Home Assistant stops sending audio (i.e. it ended the
; session) so phones don't stay off-hook waiting for a BYE.
rtp_timeout=15
; If your PBX defines multiple transports and the call fails to route,
; uncomment and set your UDP transport name (see pjsip.transports.conf):
;transport=0.0.0.0-udp
