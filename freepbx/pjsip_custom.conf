; ---------------------------------------------------------------------------
; Home Assistant Assist endpoint
;
; Append this to /etc/asterisk/pjsip.endpoint_custom.conf on the FreePBX box
; (or paste into Admin -> Config Edit -> pjsip.endpoint_custom.conf), then
; run "fwconsole reload".
;
; CHANGE 192.168.1.50 to your Home Assistant IP, and 5060 to the port you
; chose when adding the FreePBX Assist integration in Home Assistant.
; ---------------------------------------------------------------------------

[ha-assist]
type=aor
contact=sip:assist@192.168.1.50:5060
qualify_frequency=0

[ha-assist]
type=endpoint
context=from-internal
disallow=all
allow=opus
aors=ha-assist
direct_media=no
rtp_symmetric=yes
; Hang the call up if Home Assistant stops sending audio (i.e. it ended the
; session) so phones don't stay off-hook waiting for a BYE.
rtp_timeout=15
; If your PBX defines multiple transports and the call fails to route,
; uncomment and set your UDP transport name (see pjsip.transports.conf):
;transport=0.0.0.0-udp
